[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esports-sim"
version = "0.0.1"
description = "Valorant-inspired esports tycoon with a tick-level match sim, built for LLM playtesting, multi-agent RL, and world-model training."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "numpy>=1.26",
]

[project.scripts]
esports-sim = "esports_sim.app.cli:main"
esports-roster-mcp = "esports_sim.mcp.roster_server:main"
esports-map-mcp = "esports_sim.mcp.map_server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  "pillow>=10.0",  # office guide rasterizer (scripts/render_office_guide.py)
]
web = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
]
mcp = [
  # v2 is still pre-release as of 2026-07; keep the stable SDK contract.
  "mcp>=1.27,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/esports_sim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Parallel by default: this suite is dominated by whole-season campaign
# sims, so it fans out cleanly across cores (>10min serial -> ~4min on 16
# cores). `--dist loadgroup` distributes per-test (so big files spread
# across workers) but honours `@pytest.mark.xdist_group`, which conftest
# pins on the tests that share a module-scoped season fixture (test_inbox)
# so that fixture is built once, not once per worker. Escape hatches for
# debugging a single test:
#   pytest -n0            # serial, live output, usable with -x / --pdb
#   pytest -m "not slow"  # skip the whole-season soak tests (fast loop)
addopts = "-ra -n auto --dist loadgroup"
markers = [
  "slow: whole-season / multi-seed soak tests. Skipped by `-m 'not slow'` for a fast pre-merge loop; always run in CI and before a real push.",
  "engine: match-engine tests (sim/, events/, rng/). Fast; runs on every engine change.",
  "campaign: manager-layer tests (manager/). Medium; runs on campaign/data changes.",
  "web: web UI / API tests (web/). Fast; runs on UI/API changes.",
  "golden: golden gate + determinism tests. Must always pass; runs on any engine/data change.",
  "policy: learned policy / RL tests (policy/). Medium; runs on policy changes.",
  "mcp: MCP server tests (mcp/). Fast; runs on MCP protocol changes.",
  "registry: data/registry validation tests. Fast; runs on schema/data changes.",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
]

[tool.hatch.metadata]
allow-direct-references = true
