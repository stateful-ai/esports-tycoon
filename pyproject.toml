[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esports-tycoon"
version = "0.0.0"
description = "A management sim where the soul of the game is persistent player personalities."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["esports_tycoon*"]

[tool.setuptools.package-data]
# Ship the canonical canned save inside the wheel so the loader/CLI work when
# installed, not only from a source checkout.
"esports_tycoon.canned" = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
