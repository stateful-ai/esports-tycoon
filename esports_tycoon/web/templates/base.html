<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ team.name }} — Week {{ season.current_week }}{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f5f7; color: #1c1f23;
  }
  a { color: #1769aa; }
  header.top {
    background: #15181c; color: #e7e9ea; padding: 0.85rem 1.25rem;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
  }
  header.top .brand { font-weight: 700; letter-spacing: 0.02em; }
  header.top nav a { color: #cfd3d7; text-decoration: none; margin-left: 1rem; font-size: 0.92rem; }
  header.top nav a:hover { color: #fff; text-decoration: underline; }
  main { max-width: 760px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  h2 { font-size: 1.15rem; margin: 1.75rem 0 0.5rem; border-bottom: 1px solid #dfe2e6; padding-bottom: 0.25rem; }
  .sub { color: #6b7177; margin: 0 0 1rem; }
  .card { background: #fff; border: 1px solid #e2e5e9; border-radius: 10px; padding: 1rem 1.15rem; margin: 0.75rem 0; }
  .muted { color: #6b7177; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #eceef1; vertical-align: top; }
  th { color: #6b7177; font-weight: 600; font-size: 0.85rem; }
  .pos { color: #1a7f37; } .neg { color: #c0362c; }
  .btn {
    display: inline-block; background: #15181c; color: #fff; text-decoration: none;
    padding: 0.6rem 1.1rem; border-radius: 8px; border: 0; font: inherit; cursor: pointer;
  }
  .btn:hover { background: #2b3138; }
  .btn.secondary { background: #fff; color: #1c1f23; border: 1px solid #c7ccd2; }
  .flash { background: #fdecea; border: 1px solid #f5c6c0; color: #842029; padding: 0.6rem 0.9rem; border-radius: 8px; margin: 0.5rem 0 1rem; }
  label.choice { display: block; border: 1px solid #d8dce1; border-radius: 8px; padding: 0.7rem 0.9rem; margin: 0.5rem 0; cursor: pointer; background: #fff; }
  label.choice:hover { border-color: #15181c; }
  label.choice input { margin-right: 0.5rem; }
  label.choice .blurb { color: #6b7177; font-size: 0.9rem; margin: 0.2rem 0 0 1.4rem; }
  textarea { width: 100%; min-height: 4.5rem; font: inherit; padding: 0.6rem; border: 1px solid #c7ccd2; border-radius: 8px; resize: vertical; }
  .counter { color: #6b7177; font-size: 0.85rem; }
  .actions { margin-top: 1.25rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .post { padding: 0.7rem 0; border-bottom: 1px solid #eceef1; }
  .post .who { font-weight: 600; } .post .handle { color: #6b7177; font-weight: 400; }
  .post .cite { color: #6b7177; font-size: 0.82rem; margin-top: 0.2rem; }
  code { background: #eceef1; padding: 0.05rem 0.3rem; border-radius: 4px; font-size: 0.88em; }
</style>
</head>
<body>
<header class="top">
  <span class="brand">{{ team.name }} · Week {{ season.current_week }} of {{ season.total_weeks }}</span>
  <nav>
    <a href="{{ url_for('briefing') }}">Manager view</a>
    <a href="{{ url_for('feed') }}">Chirper feed</a>
    <a href="{{ url_for('reset') }}">Start over</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
