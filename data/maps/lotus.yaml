# Lotus — three sites around a compact mid. Loosely inspired by Valorant's
# Lotus: A Main/Link with a tree for cover, a Mid that forks toward C via
# Alley, and a B site fed by two close flanks. The "rotating doors" flavor
# of the real map is just ordinary adjacency here.

id: lotus
display_name: Lotus
movement_model: free
sites:
  - a
  - b
  - c
attacker_spawn: attacker_spawn
defender_spawn: defender_spawn

callouts:
  # -- Spawns ----------------------------------------------------------
  attacker_spawn:
    id: attacker_spawn
    display_name: Attacker Spawn
    site: none
    zone: attacker_spawn
    x: 52
    y: 10
  defender_spawn:
    id: defender_spawn
    display_name: Defender Spawn
    site: none
    zone: defender_spawn
    x: 35
    y: 76

  # -- A site -----------------------------------------------------------
  a_main:
    id: a_main
    display_name: A Main
    site: a
    zone: attacker_side
    x: 20
    y: 33
  a_link:
    id: a_link
    display_name: A Link
    site: a
    zone: attacker_side
    x: 28
    y: 61
  a_site:
    id: a_site
    display_name: A Site
    site: a
    zone: site
    x: 10
    y: 62
  a_tree:
    id: a_tree
    display_name: Tree
    site: a
    zone: defender_side
    x: 10
    y: 75
  a_dock:
    id: a_dock
    display_name: Dock
    site: a
    zone: defender_side
    x: 26
    y: 75

  # -- Mid ----------------------------------------------------------------
  mid_tree:
    id: mid_tree
    display_name: Mid Tree
    site: mid
    zone: mid
    x: 37
    y: 36
  mid_center:
    id: mid_center
    display_name: Mid
    site: mid
    zone: mid
    x: 62
    y: 25
  alley:
    id: alley
    display_name: Alley
    site: mid
    zone: mid
    x: 66
    y: 31

  # -- B site -----------------------------------------------------------
  b_main:
    id: b_main
    display_name: B Main
    site: b
    zone: attacker_side
    x: 57
    y: 36
  b_diamond:
    id: b_diamond
    display_name: Diamond
    site: b
    zone: attacker_side
    x: 35
    y: 46
  b_site:
    id: b_site
    display_name: B Site
    site: b
    zone: site
    x: 48
    y: 52
  b_link:
    id: b_link
    display_name: B Link
    site: b
    zone: defender_side
    x: 38
    y: 63
  b_tower:
    id: b_tower
    display_name: Tower
    site: b
    zone: defender_side
    x: 46
    y: 63

  # -- C site -----------------------------------------------------------
  c_main:
    id: c_main
    display_name: C Main
    site: c
    zone: attacker_side
    x: 80
    y: 26
  c_alley:
    id: c_alley
    display_name: C Alley
    site: c
    zone: attacker_side
    x: 66
    y: 50
  c_site:
    id: c_site
    display_name: C Site
    site: c
    zone: site
    x: 86
    y: 49
  c_tunnel:
    id: c_tunnel
    display_name: Tunnel
    site: c
    zone: defender_side
    x: 60
    y: 74
  c_dock:
    id: c_dock
    display_name: C Dock
    site: c
    zone: defender_side
    x: 80
    y: 63

# Lotus's identity: the rotating stone doors. Great flank routes — but
# everyone nearby hears the stone grind when they swing.
gimmicks:
  - id: lotus_door_a
    type: rotating_door
    between: [a_link, a_site]
    noise_radius: 26
  - id: lotus_door_c
    type: rotating_door
    between: [c_alley, c_site]
    noise_radius: 26

# Directed adjacency. Symmetric by default (both sides can traverse).
# Rewired with the trace: Diamond is the west site hall fed from the
# Tree lane (not a spawn door), the Tree lane branches off A Main's
# turn, and the C back rooms chain site -> dock -> tunnel -> CT.
adjacency:
  attacker_spawn: [a_main, mid_center, b_main, c_main]
  defender_spawn: [a_tree, a_dock, b_link, b_tower, c_tunnel]

  a_main: [attacker_spawn, a_site, mid_tree]
  a_link: [b_diamond, a_site]
  a_site: [a_main, a_link, a_tree, a_dock]
  a_tree: [a_site, a_dock, defender_spawn]
  a_dock: [a_site, a_tree, defender_spawn]

  mid_tree: [a_main, b_diamond]
  mid_center: [attacker_spawn, alley, b_main]
  alley: [mid_center, c_alley]

  b_main: [attacker_spawn, mid_center, b_site]
  b_diamond: [mid_tree, a_link, b_site]
  b_site: [b_main, b_diamond, b_link, b_tower]
  b_link: [b_site, b_tower, defender_spawn]
  b_tower: [b_site, b_link, defender_spawn]

  c_main: [attacker_spawn, c_site]
  c_alley: [alley, c_site]
  c_site: [c_main, c_alley, c_dock]
  c_tunnel: [c_dock, defender_spawn]
  c_dock: [c_site, c_tunnel]

# Sightlines — which callouts can see into which. advantaged_side is a
# *default*; smokes/utility can flip it in-round.
sightlines:
  - { from_callout: a_main, to_callout: a_site, advantaged_side: defense }
  - { from_callout: a_link, to_callout: a_site, advantaged_side: defense }
  - { from_callout: a_tree, to_callout: a_site, advantaged_side: defense }
  # Dock is the rope flank, not a pre-aimed hold — neutral keeps the eye
  # without the anchor bonus. With four defensive angles ringing A, post-
  # plant retakes ran 74% (site probe, 100 seeds); Tree keeps the iconic
  # overlook and Dock becomes contestable ground.
  - { from_callout: a_dock, to_callout: a_site }
  - { from_callout: b_main, to_callout: b_site, advantaged_side: defense }
  - { from_callout: b_diamond, to_callout: b_site, advantaged_side: defense }
  - { from_callout: b_link, to_callout: b_site, advantaged_side: defense }
  - { from_callout: b_tower, to_callout: b_site, advantaged_side: defense }
  - { from_callout: c_main, to_callout: c_site, advantaged_side: defense }
  - { from_callout: c_alley, to_callout: c_site, advantaged_side: defense }
  - { from_callout: c_dock, to_callout: c_site, advantaged_side: defense }
  - { from_callout: mid_tree, to_callout: b_diamond }
  - { from_callout: mid_center, to_callout: b_main }
  - { from_callout: alley, to_callout: c_alley }
