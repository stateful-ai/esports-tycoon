# Hand-tuned geometry — Split's two sites flanking a tall, narrow mid.
# Mid Top is the vertical spine forking into Vent (feeds A Ramps) and
# Sewer (feeds B Garden); A and B are near-mirror images of each other.
map_id: split
regions:
  # -- Spawns. Attacker spawn reaches both mains; defender spawn is the
  # full back plaza — it puts floor under the Heaven and Elbow doorways on
  # both wings and holds its own anchor point.
  attacker_spawn: { x: 27.0, y: 0.0, w: 46.0, h: 16.0 }
  defender_spawn: { x: 20.0, y: 72.0, w: 60.0, h: 21.0 }

  # -- A site -------------------------------------------------------------
  a_main: { x: 12.0, y: 14.0, w: 16.0, h: 32.0 }
  a_ramps: { x: 24.0, y: 29.0, w: 14.0, h: 16.5 }
  a_site: { x: 8.0, y: 45.0, w: 20.0, h: 20.0 }
  a_heaven: { x: 7.0, y: 61.0, w: 14.0, h: 14.0, z: 5.0 }
  a_screens: { x: 17.0, y: 63.0, w: 14.0, h: 18.0 }

  # -- Mid (tall, narrow spine) -----------------------------------------------
  mid_top: { x: 44.0, y: 16.0, w: 12.0, h: 26.0 }
  mid_vent: { x: 33.0, y: 37.0, w: 14.0, h: 14.0 }
  mid_sewer: { x: 53.0, y: 37.0, w: 14.0, h: 14.0 }

  # -- B site ---------------------------------------------------------------
  b_main: { x: 72.0, y: 14.0, w: 16.0, h: 32.0 }
  b_garden: { x: 62.0, y: 29.0, w: 14.0, h: 16.5 }
  b_site: { x: 72.0, y: 45.0, w: 20.0, h: 20.0 }
  b_elbow: { x: 79.0, y: 61.0, w: 14.0, h: 14.0 }
  b_rafters: { x: 69.0, y: 63.0, w: 14.0, h: 18.0, z: 5.0 }

corridors:
  # A Main is a doglegged hallway off spawn — the dogleg runs down the
  # Mid Top spine and cuts across Vent/Ramps floor, never off-plate.
  - between: [attacker_spawn, a_main]
    via: [[53.2, 41.5]]
  # Mid Top loops wide inside spawn before it doors down into the spine.
  - between: [attacker_spawn, mid_top]
    via: [[62.0, 12.0], [53.0, 17.0]]
  # Sewer doglegs into Garden — the loop stays inside the sewer room.
  - between: [mid_sewer, b_garden]
    via: [[66.0, 49.0], [65.0, 38.0]]
  # Heaven and Elbow touch the widened defender plaza directly now; the
  # auto-portals are the short interior lines back to spawn.

# Detail layer: plant-cover crates in each site plus one in each main lane
# room. A Heaven and B Rafters are Split's two heaven-style perches over
# the plants. A Screens gets a full-height "screen" prop — the room is
# named for the tarp/mesh structure that obscures vision into A Site in
# the real map — which intentionally breaks the (defense-advantaged)
# a_screens -> a_site sightline; it does not cross the a_main, a_ramps, or
# a_heaven lines into site, which stay open.
props:
  # -- A site cover -------------------------------------------------------
  - { region: a_site, x: 10.0, y: 47.0, w: 3.0, h: 3.0, height: half }
  - { region: a_site, x: 18.0, y: 49.0, w: 3.0, h: 3.0, height: half }
  - { region: a_site, x: 12.0, y: 57.0, w: 3.0, h: 3.0, height: half }
  # -- B site cover -------------------------------------------------------
  - { region: b_site, x: 74.0, y: 47.0, w: 3.0, h: 3.0, height: half }
  - { region: b_site, x: 82.0, y: 49.0, w: 3.0, h: 3.0, height: half }
  - { region: b_site, x: 76.0, y: 57.0, w: 3.0, h: 3.0, height: half }
  # -- Main lane cover ------------------------------------------------------
  - { region: a_main, x: 14.0, y: 25.0, w: 3.0, h: 3.0, height: half }
  - { region: b_main, x: 76.0, y: 25.0, w: 3.0, h: 3.0, height: half }
  # -- Screens (sight blocker) -----------------------------------------------
  - { region: a_screens, x: 21.0, y: 68.0, w: 4.0, h: 4.0, height: full }
