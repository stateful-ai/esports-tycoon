# Traced from the real Haven minimap (wiki), canonical frame: attackers
# at low y, sites A/B/C left-to-right across y 50-70, defender octagon +
# spawn vase at the bottom. The three-lane identity survives the trace:
# A Long's diagonal, the garage-and-window mid complex feeding B, and
# C Long's straight run down the east wall.
#
# L-shaped and diagonal rooms are bounding rects with full-height "mask"
# props over their solid volumes (trace-map skill); masks are placed to
# leave every declared sightline clear (checked hop-by-hop).
map_id: haven
regions:
  # -- Spawns. Attacker spawn is the north octagon (interior planter
  # masked); defender spawn is the CT octagon plus the vase point, with
  # the void flanks masked.
  attacker_spawn: { x: 39.0, y: 0.0, w: 29.0, h: 19.0 }
  defender_spawn: { x: 26.0, y: 64.0, w: 24.0, h: 33.0 }

  # -- A side --------------------------------------------------------------
  a_lobby: { x: 25.0, y: 19.0, w: 15.0, h: 14.0 }
  # A Long: the diagonal lane + its landing elbow; void wedges masked.
  a_long: { x: 5.0, y: 32.0, w: 26.0, h: 18.0 }
  a_short: { x: 13.0, y: 47.0, w: 6.5, h: 9.5 }
  # A Site reaches up to the long elbow's seam at y 50; the void strip
  # west of the door column is masked.
  a_site: { x: 4.5, y: 50.0, w: 14.5, h: 20.0 }
  a_heaven: { x: 19.0, y: 56.0, w: 7.0, h: 10.0, z: 5.0 }
  # Sewer: the hall running east from the short column to the mid doors.
  a_sewer: { x: 19.0, y: 50.0, w: 20.0, h: 6.5 }

  # -- Mid + B -------------------------------------------------------------
  b_main: { x: 40.0, y: 19.0, w: 18.0, h: 7.0 }
  b_garage: { x: 42.0, y: 24.0, w: 12.0, h: 10.0 }
  mid_courtyard: { x: 30.0, y: 26.0, w: 12.0, h: 14.0 }
  mid_window: { x: 33.0, y: 33.0, w: 7.0, h: 8.0 }
  mid_doors: { x: 39.0, y: 34.0, w: 6.0, h: 18.0 }
  b_site: { x: 38.0, y: 52.0, w: 17.0, h: 16.0 }
  b_back: { x: 50.0, y: 56.0, w: 10.0, h: 12.0 }

  # -- C side --------------------------------------------------------------
  c_lobby: { x: 58.0, y: 19.0, w: 25.0, h: 8.0 }
  # C Long: the corner room + the lane down the east wall (flanks masked).
  c_long: { x: 74.0, y: 22.0, w: 16.0, h: 28.0 }
  c_site: { x: 70.0, y: 50.0, w: 20.0, h: 20.0 }
  c_cubby: { x: 64.0, y: 52.0, w: 6.0, h: 10.0 }
  # C Link: the hall behind B/C sites running to the CT octagon.
  c_link: { x: 50.0, y: 62.0, w: 20.0, h: 10.0 }

corridors:
  # Lane walks dogleg like the real streets — the portal-direct lines
  # would cut across room interiors and undercount every rotate.
  - between: [attacker_spawn, a_lobby]
    via: [[58.0, 11.0], [46.0, 16.0], [40.0, 18.0], [36.0, 21.0], [30.0, 24.0]]
  - between: [a_lobby, a_long]
    via: [[36.0, 30.0], [29.0, 33.0], [22.0, 36.0], [15.0, 40.0]]
  - between: [attacker_spawn, b_main]
    via: [[46.0, 11.0], [41.0, 16.0], [46.0, 18.0], [49.0, 21.0]]
  - between: [b_main, mid_courtyard]
    via: [[52.0, 23.0], [44.0, 21.0], [40.0, 25.0], [34.0, 29.0]]
  - between: [mid_courtyard, mid_doors]
    via: [[32.0, 37.0], [35.0, 39.5], [39.0, 38.0]]
  - between: [attacker_spawn, c_lobby]
    via: [[59.0, 11.0], [65.0, 15.0], [60.0, 18.0], [65.0, 22.0]]
  - between: [c_lobby, c_long]
    via: [[75.0, 21.0], [81.0, 24.0], [76.0, 26.0], [81.0, 29.0], [78.0, 32.0]]
  - between: [c_long, c_site]
    via: [[80.0, 44.0], [79.0, 47.0], [81.0, 49.0]]
  - between: [b_main, b_garage]
    via: [[53.0, 23.0], [50.0, 27.0], [46.0, 30.0]]
  - between: [b_garage, mid_doors]
    via: [[50.0, 32.0], [45.0, 34.0], [42.0, 38.0]]
  - between: [mid_doors, b_site]
    via: [[42.0, 49.0], [43.0, 53.0]]
  # A Long lands in site through the door column (the walk hugs the
  # column, not the diagonal's midline).
  - between: [a_long, a_site]
    via: [[16.0, 49.0], [15.0, 53.0]]
  # B Back's walk to CT swings through the link hall.
  - between: [b_back, defender_spawn]
    via: [[54.0, 70.0]]

# Doorway openings (trace-map P0): declared spans pin portals to real
# doorways; the rest of that seam is wall for the free-roam layer.
openings:
  - { between: [attacker_spawn, b_main], span: [44.0, 54.0] }    # spawn mouth
  - { between: [attacker_spawn, c_lobby], span: [60.0, 66.0] }   # east mouth
  - { between: [a_lobby, a_long], span: [26.0, 30.0] }           # long door
  - { between: [a_long, a_site], span: [14.0, 18.5] }            # long door column
  - { between: [a_site, a_heaven], span: [58.0, 62.0] }          # heaven door
  - { between: [b_main, b_garage], span: [45.0, 51.0] }          # garage doors
  - { between: [b_garage, mid_courtyard], span: [28.0, 33.0] }   # garage west door
  - { between: [mid_courtyard, mid_doors], span: [36.0, 39.5] }  # mid doors
  - { between: [b_site, b_back], span: [58.0, 62.0] }            # back door
  - { between: [b_site, c_link], span: [63.0, 67.0] }            # link door
  - { between: [c_lobby, c_long], span: [76.0, 81.0] }           # corner door
  - { between: [c_long, c_site], span: [78.0, 84.0] }            # long mouth
  - { between: [c_site, c_cubby], span: [53.0, 57.0] }           # cubby window
  - { between: [c_site, c_link], span: [64.0, 68.0] }            # link door
  - { between: [defender_spawn, c_link], span: [65.0, 71.0] }    # CT east mouth

# Detail layer: full-height masks (solid volume inside bounding rects)
# first, then site furniture. B Site's tall box sits in the site's west
# half so the b_main/b_garage defense reads stay live (checked).
props:
  # -- Attacker spawn interior planter --------------------------------------
  - { region: attacker_spawn, x: 50.0, y: 13.0, w: 14.0, h: 6.0, height: full }
  # -- A Long void wedges ---------------------------------------------------
  - { region: a_long, x: 5.0, y: 32.0, w: 7.0, h: 5.0, height: full }
  - { region: a_long, x: 20.0, y: 42.0, w: 11.0, h: 6.0, height: full }
  # -- C Long lane flanks ---------------------------------------------------
  - { region: c_long, x: 74.0, y: 33.0, w: 4.0, h: 17.0, height: full }
  - { region: c_long, x: 84.0, y: 30.0, w: 6.0, h: 20.0, height: full }
  # -- A Site's void strip west of the long-door column ---------------------
  - { region: a_site, x: 4.5, y: 50.0, w: 8.5, h: 6.0, height: full }
  # -- B Back's west sliver (site east wall) --------------------------------
  - { region: b_back, x: 50.0, y: 56.0, w: 2.0, h: 6.0, height: full }
  # -- Defender spawn void flanks -------------------------------------------
  - { region: defender_spawn, x: 26.0, y: 68.0, w: 7.0, h: 18.0, height: full }
  - { region: defender_spawn, x: 33.0, y: 90.0, w: 5.0, h: 7.0, height: full }
  - { region: defender_spawn, x: 45.0, y: 88.0, w: 5.0, h: 9.0, height: full }
  # -- B Site's tall box (west half; see header) ---------------------------
  - { region: b_site, x: 40.5, y: 58.0, w: 4.0, h: 4.5, height: full }
  # -- Site plant cover -----------------------------------------------------
  - { region: a_site, x: 12.0, y: 58.5, w: 4.0, h: 3.0, height: half }
  - { region: a_site, x: 6.5, y: 61.0, w: 3.0, h: 3.0, height: half }
  - { region: a_site, x: 13.0, y: 65.5, w: 3.0, h: 3.0, height: half }
  - { region: b_site, x: 50.0, y: 56.0, w: 3.0, h: 3.0, height: half }
  - { region: b_site, x: 42.0, y: 64.0, w: 3.0, h: 3.0, height: half }
  - { region: b_site, x: 48.5, y: 63.5, w: 3.0, h: 3.0, height: half }
  - { region: c_site, x: 80.0, y: 57.0, w: 4.0, h: 3.0, height: half }
  - { region: c_site, x: 74.0, y: 62.0, w: 3.0, h: 3.0, height: half }
  - { region: c_site, x: 83.0, y: 64.5, w: 3.0, h: 3.0, height: half }
  # -- Holder-spot cover ----------------------------------------------------
  - { region: a_heaven, x: 21.0, y: 58.0, w: 3.0, h: 3.0, height: half }
  - { region: a_sewer, x: 24.0, y: 51.5, w: 3.0, h: 3.0, height: half }
  - { region: b_back, x: 54.0, y: 58.0, w: 3.0, h: 3.0, height: half }
  - { region: c_link, x: 58.0, y: 64.0, w: 3.0, h: 3.0, height: half }
  - { region: b_garage, x: 46.0, y: 26.0, w: 3.0, h: 3.0, height: half }
  # -- A Long lane box (the crate on the diagonal) --------------------------
  - { region: a_long, x: 11.0, y: 39.0, w: 3.0, h: 3.0, height: half }
