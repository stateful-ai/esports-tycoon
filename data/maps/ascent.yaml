# Ascent — two sites around an open mid. Mid control feeds both sites.

id: ascent
display_name: Ascent
sites:
  - a
  - b
attacker_spawn: attacker_spawn
defender_spawn: defender_spawn

callouts:
  attacker_spawn:
    id: attacker_spawn
    display_name: Attacker Spawn
    site: none
    zone: attacker_spawn
    x: 50
    y: 8
  defender_spawn:
    id: defender_spawn
    display_name: Defender Spawn
    site: none
    zone: defender_spawn
    x: 50
    y: 92

  # -- A side -------------------------------------------------------------
  a_lobby:
    id: a_lobby
    display_name: A Lobby
    site: a
    zone: attacker_side
    x: 22
    y: 22
  a_main:
    id: a_main
    display_name: A Main
    site: a
    zone: attacker_side
    x: 16
    y: 38
  a_site:
    id: a_site
    display_name: A Site
    site: a
    zone: site
    x: 20
    y: 60
  a_heaven:
    id: a_heaven
    display_name: A Heaven
    site: a
    zone: defender_side
    x: 24
    y: 74
  a_garden:
    id: a_garden
    display_name: A Garden
    site: a
    zone: defender_side
    x: 34
    y: 68

  # -- Mid ----------------------------------------------------------------
  catwalk:
    id: catwalk
    display_name: Catwalk
    site: mid
    zone: mid
    x: 38
    y: 42
  mid_courtyard:
    id: mid_courtyard
    display_name: Mid Courtyard
    site: mid
    zone: mid
    x: 50
    y: 46
  mid_market:
    id: mid_market
    display_name: Market
