  # -- B side ---------------------------------------------------------------
  b_lobby:
    id: b_lobby
    display_name: B Lobby
    site: b
    zone: attacker_side
    x: 80
    y: 22
  b_main:
    id: b_main
    display_name: B Main
    site: b
    zone: attacker_side
    x: 78
    y: 40
  b_site:
    id: b_site
    display_name: B Site
    site: b
    zone: site
    x: 78
    y: 62
