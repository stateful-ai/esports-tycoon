# Ascent — two sites around an open mid. Mid control feeds both sites.

id: ascent
display_name: Ascent
sites:
  - a
  - b
attacker_spawn: attacker_spawn
defender_spawn: defender_spawn

callouts:
  attacker_spawn:
    id: attacker_spawn
    display_name: Attacker Spawn
    site: none
    zone: attacker_spawn
    x: 50
    y: 8
  defender_spawn:
    id: defender_spawn
    display_name: Defender Spawn
    site: none
    zone: defender_spawn
    x: 50
    y: 92

  # -- A side -------------------------------------------------------------
  a_lobby:
    id: a_lobby
    display_name: A Lobby
    site: a
    zone: attacker_side
    x: 22
    y: 22
  a_main:
    id: a_main
    display_name: A Main
    site: a
    zone: attacker_side
    x: 16
    y: 38
  a_site:
    id: a_site
    display_name: A Site
    site: a
    zone: site
    x: 20
    y: 60
  a_heaven:
    id: a_heaven
    display_name: A Heaven
    site: a
    zone: defender_side
    x: 24
    y: 74
  a_garden:
    id: a_garden
    display_name: A Garden
    site: a
    zone: defender_side
    x: 34
    y: 68

  # -- Mid ----------------------------------------------------------------
  catwalk:
    id: catwalk
    display_name: Catwalk
    site: mid
    zone: mid
    x: 38
    y: 42
  mid_courtyard:
    id: mid_courtyard
    display_name: Mid Courtyard
    site: mid
    zone: mid
    x: 50
    y: 46
  mid_market:
    id: mid_market
    display_name: Market
    site: mid
    zone: defender_side
    x: 62
    y: 58

  # -- B side ---------------------------------------------------------------
  b_lobby:
    id: b_lobby
    display_name: B Lobby
    site: b
    zone: attacker_side
    x: 80
    y: 22
  b_main:
    id: b_main
    display_name: B Main
    site: b
    zone: attacker_side
    x: 78
    y: 40
  b_site:
    id: b_site
    display_name: B Site
    site: b
    zone: site
    x: 78
    y: 62
  b_back:
    id: b_back
    display_name: B Back
    site: b
    zone: defender_side
    x: 74
    y: 76

adjacency:
  attacker_spawn: [a_lobby, mid_courtyard, b_lobby]
  a_lobby: [attacker_spawn, a_main, catwalk]
  a_main: [a_lobby, a_site]
  a_site: [a_main, a_heaven, a_garden, catwalk]
  a_heaven: [a_site, a_garden, defender_spawn]
  a_garden: [a_site, a_heaven, catwalk, defender_spawn]
  catwalk: [a_lobby, mid_courtyard, a_site, a_garden]
  mid_courtyard: [attacker_spawn, catwalk, mid_market, b_main]
  mid_market: [mid_courtyard, b_site, defender_spawn]
  b_lobby: [attacker_spawn, b_main]
  b_main: [b_lobby, b_site, mid_courtyard]
  b_site: [b_main, b_back, mid_market]
  b_back: [b_site, defender_spawn]
  defender_spawn: [a_heaven, a_garden, mid_market, b_back]

sightlines:
  - { from_callout: a_main, to_callout: a_site, advantaged_side: defense }
  - { from_callout: a_heaven, to_callout: a_site, advantaged_side: defense }
  - { from_callout: a_garden, to_callout: a_site, advantaged_side: defense }
  - { from_callout: catwalk, to_callout: a_site }
  - { from_callout: b_main, to_callout: b_site, advantaged_side: defense }
  - { from_callout: b_back, to_callout: b_site, advantaged_side: defense }
  - { from_callout: mid_market, to_callout: b_site, advantaged_side: defense }
  - { from_callout: mid_courtyard, to_callout: catwalk }
  - { from_callout: mid_courtyard, to_callout: mid_market }
