  attacker_spawn:
    id: attacker_spawn
    display_name: Attacker Spawn
    site: none
    zone: attacker_spawn
    x: 48
    y: 8
  defender_spawn:
    id: defender_spawn
    display_name: Defender Spawn
    site: none
    zone: defender_spawn
    x: 49
    y: 76

  # -- A side --------------------------------------------------------------
  a_lobby:
    id: a_lobby
    display_name: A Lobby
