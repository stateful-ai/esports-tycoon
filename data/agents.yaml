        type: signature
        charges: 1
        cost: 0
        flashes: true
      - id: breach_rolling_thunder
        name: Rolling Thunder
        type: ultimate
        ult_points: 9
        damages: true
        flashes: true

  - id: cypher
    display_name: Cypher
    role: sentinel
    description: >-
      Information sentinel. Trips and cam turn a site into a spider web;
