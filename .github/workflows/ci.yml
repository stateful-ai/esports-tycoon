# esports-tycoon CI smoke.
#
# Runs `make test` from a clean clone on every push and pull request. The whole
# slice is built to run zero-API by default (templated content backend, no
# network, no GPU), so this job does not need — and does not provide — any
# GAME_LLM_* / OPENAI_* / API_KEY secrets. If anything in the test path ever
# tries to talk to a real endpoint, that's the regression and CI is the right
# place to catch it.
#
# The golden + round-trip determinism tests live in
# `tests/test_golden_determinism.py` and read their committed bytes from
# `tests/golden/`. They fail the build the moment the engine's output drifts
# from those bytes, which is exactly the gate the acceptance bar names:
# "CI fails the build if golden output drifts." `make test` explicitly unsets
# UPDATE_GOLDEN so an exported value in the runner environment can never bless
# drift; this workflow also strips it from the job env defensively.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref so a quick force-push doesn't queue up
# stale work; the last commit on a branch is what matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml; 3.12 is what the
        # contributor box runs. Both must stay green.
        python-version: ["3.10", "3.12"]
    env:
      # Belt-and-braces: `make test` already unsets this, but stripping it at
      # the job level means a future workflow change can't accidentally bless
      # drifted goldens by exporting it.
      UPDATE_GOLDEN: ""
      # Default to the zero-API content backend regardless of what the runner
      # image might have set. Tests pin this explicitly too; this is a defence
      # in depth.
      ESPORTS_TYCOON_CONTENT_BACKEND: templated

    steps:
      - name: Checkout (clean clone)
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (no API keys, no GPU extras)
        run: make install

      # The headline check: `make test` runs the full suite, which includes
      # the golden + round-trip determinism tests. Any drift is a hard fail.
      - name: make test
        run: make test

      # Second pass, narrowly scoped to the golden + round-trip tests, so a
      # red CI surfaces "golden drift" by name in the job log even when an
      # unrelated suite happens to fail in the same run.
      - name: make test-golden
        if: always()
        run: make test-golden
