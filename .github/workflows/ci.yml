# CI: test suite + a dedicated determinism gate.
#
# The determinism step re-runs the reproducibility tests in their own step so
# a drift failure is immediately legible in the Actions UI (adapted from the
# esports-tycoon prototype's "golden drift" job shape).

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test suite
        run: pytest -q

      - name: Determinism gate
        run: pytest -q tests/test_determinism.py tests/test_engine.py tests/test_manager.py -k "determin or identical" --no-header
