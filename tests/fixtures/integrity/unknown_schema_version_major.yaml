# Negative fixture: a save at the next-major schema_version this build cannot read.
#
# The fourth committed fail-closed case alongside ``orphan_mem_cite.yaml``,
# ``dangling_actor.yaml``, and ``loose_floats_shuffled_keys.yaml``. The body
# shape mirrors the canonical week6 save just enough to prove that the
# version gate fires *before* the rest of the schema is touched: when
# ``loader.load`` sees a ``schema_version`` strictly newer than
# :data:`esports_tycoon.schema.CURRENT_SCHEMA_VERSION` (currently ``0``),
# it raises :class:`loader.SchemaVersionError` with a message naming the
# offending version and the version this build supports.
#
# Why a *second* unknown-version fixture in this directory? Sibling
# ``unknown_version.yaml`` (added in the schema_version PR) pins the
# sky-high-future case (``9999``) so the test still meaningful after we bump
# ``CURRENT_SCHEMA_VERSION``. This fixture pins the realistic *next-major*
# case (``1`` — one past current ``0``), which is the version a save would
# actually carry the day after the migration seam is exercised. A regression
# that lets newer-by-one through but blocks far-future would trip here, not
# in the sibling.
#
# Shape-validation never runs against this body: the version gate raises
# first, so the placeholder values below are deliberately minimal. The
# message contract the test asserts is the file path, the literal token
# ``schema_version``, and the offending value ``1``.
schema_version: 1
seed: 0
save:
  id: week6
  title: "Unknown schema_version (next major)"
  game: Vector Strike
  tone: dry-mockumentary
  flavor: valorant-flavored
  fiction_note: "Negative fixture for unknown-schema_version-major fail-closed."
  season:
    league: x
    division: y
    total_weeks: 8
    current_week: 6
    playoff_cutoff: 6
  team:
    id: overcast
    name: Overcast
    tag: OVC
    handle: "@overcast"
    blurb: "blurb"
    standing: { wins: 0, losses: 0, place: 1, of: 1, note: "" }
players: []
last_week:
  week: 0
  opponent: northwind
  format: Bo3
  result: loss
  scoreline:
    overcast: 0
    opponent: 0
    maps: []
  headline: ""
