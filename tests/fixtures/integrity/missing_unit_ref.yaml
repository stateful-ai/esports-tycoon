# Negative fixture: shape-valid save with a single dangling unit reference.
#
# The body is the canonical week6 save, byte-for-byte, EXCEPT a clash pair
# whose ``b`` names ``vexx`` (a typo of ``vex``) — a unit id no player or
# rival star defines. ``loader.load`` parses the YAML and shape-validates the
# typed schema cleanly, then ``check_referential_integrity`` raises
# ``SaveReferentialIntegrityError`` with a message naming the path and the
# missing id. The point of carrying this as a committed fixture (vs. a
# programmatic mutation in the test) is to prove the failure on real,
# shape-valid YAML — the same path a misedited save in the wild would take.
