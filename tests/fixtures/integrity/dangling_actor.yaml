# Negative fixture: shape-valid save with a dangling ``actors`` reference.
#
# Every cite resolves (so ``WorldState._grounding_holds`` passes), but the
# memory entry ``mem:rook:debut`` lists ``phantom_unit`` among its ``actors``
# — a unit id no player, team, rival org, or rival star defines. The load
# parses, shape-validates, then fails at ``check_referential_integrity`` with
# a ``SaveReferentialIntegrityError`` whose message names the exact field path
# (``players[0=rook].memory_log[0=mem:rook:debut].actors[1]``) and the missing
# id, so a hand-author can take the message straight to the offending line.
# Distinct from the orphan-cite fixture (which fails *during* shape validation
# inside ``_grounding_holds``) and from the unit-typo fixture (which trips on
# a clash pair's ``b``).
