# Negative fixture: shape-valid save with an orphan ``mem:`` cite.
#
# The body is a small shape-valid save whose ``clash_pairs[0].seeded_by`` cites
# ``mem:rook:never_happened`` — a memory id no entry in the save defines. This
# fails one rung *earlier* than ``missing_unit_ref.yaml``: the dangling cite is
# caught inside ``WorldState._grounding_holds`` (a pydantic ``@model_validator``)
# at schema-validation time, before ``check_referential_integrity`` ever runs.
# The load surfaces as a ``pydantic.ValidationError`` whose message names both
# the orphan cite id and the clash it lives in, so a hand-author can take the
# message straight to the offending line — distinct from the referential-
# integrity failure (which is a different typed error) and from the schema-
# version gate (which fires before this one). The point of committing this as
# a fixture is to prove the contract on a *real, on-disk* save, not just on a
# programmatic mutation in a test.
